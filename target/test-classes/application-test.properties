# ============================================================
# CyberShield Nexus - TEST Profile Configuration
# Uses H2 in-memory database -- no PostgreSQL required for tests
# ============================================================

# H2 in-memory database (auto-created, destroyed after tests)
spring.datasource.url=jdbc:h2:mem:cybershield_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Let Hibernate create the schema from entities
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# JWT -- same secret as main config (required for context to load)
app.jwt.secret=CyberShieldNexusSecretKey2024NEDIScenarioVITVellore
app.jwt.expiration-ms=86400000

# Silence most logs during test
logging.level.com.cybershield=WARN
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN
