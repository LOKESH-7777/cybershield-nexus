# ============================================================
# CyberShield Nexus - Application Configuration (Default/Local)
# ============================================================

# Server
server.port=8081
spring.application.name=CyberShieldNexus

# ============================================================
# Database Configuration (Embedded Persistent H2 with PostgreSQL Compatibility)
# Zero-setup: runs immediately without requiring local PostgreSQL installation.
# ============================================================
spring.datasource.url=jdbc:h2:file:./data/cybershield_db;MODE=PostgreSQL;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret=CyberShieldNexusSecretKey2024NEDIScenarioVITVellore
app.jwt.expiration-ms=86400000

logging.level.com.cybershield=DEBUG
logging.level.org.springframework.security=DEBUG

alert.email.enabled=false
alert.email.to=soc-team@example.com
alert.email.from=cybershield-nexus@example.com

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true