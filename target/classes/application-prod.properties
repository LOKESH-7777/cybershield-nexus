# ============================================================
# CyberShield Nexus - Production Configuration (Render)
# Activated when SPRING_PROFILES_ACTIVE=prod is set.
# ============================================================

server.port=${PORT:8081}

# ============================================================
# Database - PostgreSQL via Render environment variables
# ============================================================
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.h2.console.enabled=false

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ============================================================
# JWT - override secret via Render env var in production
# ============================================================
app.jwt.secret=${JWT_SECRET:CyberShieldNexusSecretKey2024NEDIScenarioVITVellore}
app.jwt.expiration-ms=86400000

logging.level.com.cybershield=INFO
logging.level.org.springframework.security=INFO

alert.email.enabled=${ALERT_EMAIL_ENABLED:false}
alert.email.to=${ALERT_EMAIL_TO:soc-team@example.com}
alert.email.from=${ALERT_EMAIL_FROM:cybershield-nexus@example.com}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
