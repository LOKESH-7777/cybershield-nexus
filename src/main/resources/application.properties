# ============================================================
# CyberShield Nexus - Application Configuration
# ============================================================

# Server
server.port=8081
spring.application.name=CyberShieldNexus

# ============================================================
# Database Configuration (Embedded Persistent H2 with PostgreSQL Compatibility)
# Zero-setup: runs immediately without requiring local PostgreSQL installation.
# Data is saved locally in ./data/cybershield_db so it persists across restarts.
# ============================================================
spring.datasource.url=jdbc:h2:file:./data/cybershield_db;MODE=PostgreSQL;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 Console (available at http://localhost:8081/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ============================================================
# OPTIONAL: External PostgreSQL 16 Setup
# To switch to local PostgreSQL, uncomment the lines below:
# ============================================================
# spring.datasource.url=jdbc:postgresql://localhost:5432/cybershield_db
# spring.datasource.username=cybershield_user
# spring.datasource.password=CyberShield@2024
# spring.datasource.driver-class-name=org.postgresql.Driver
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ============================================================
# JPA / Hibernate
# ============================================================
# 'update' = auto-creates/alters tables on startup (safe for dev)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ============================================================
# JWT Configuration
# ============================================================
# Secret key (must be at least 256 bits for HS256)
# IMPORTANT: Change this in production to a secure random value
app.jwt.secret=CyberShieldNexusSecretKey2024NEDIScenarioVITVellore
app.jwt.expiration-ms=86400000

# ============================================================
# Logging
# ============================================================
logging.level.com.cybershield=DEBUG
logging.level.org.springframework.security=DEBUG

# ============================================================
# ENHANCEMENT: Email Alerting on HIGH / CRITICAL Incidents
# Set alert.email.enabled=true and fill in real SMTP creds to activate.
# When disabled (default), AlertService just logs instead of sending mail
# so the app still runs with zero setup.
# ============================================================
alert.email.enabled=false
alert.email.to=soc-team@example.com
alert.email.from=cybershield-nexus@example.com

# Example for Gmail SMTP (use an App Password, not your real password):
# spring.mail.host=smtp.gmail.com
# spring.mail.port=587
# spring.mail.username=your_email@gmail.com
# spring.mail.password=your_16_char_app_password
# spring.mail.properties.mail.smtp.auth=true
# spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
